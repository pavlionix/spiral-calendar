<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strum Live</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--orange:#E8472A;--blue:#2277DD;--bg:#0c0c0c}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:#fff;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* ── top bar ── */
.topbar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#0a0a0a;
  border-bottom:1px solid #1c1c1c;flex-shrink:0;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:auto}
.brand .ey{font-size:9px;font-weight:800;letter-spacing:.18em;color:var(--orange);text-transform:uppercase}
.brand .ti{font-size:14px;font-weight:800}
.btn{padding:8px 15px;background:var(--orange);border:none;border-radius:6px;color:#fff;
  font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;border:1px solid #2e2e2e;color:#aaa}
.btn:disabled{opacity:.35;cursor:not-allowed}
.ctl{display:flex;align-items:center;gap:6px}
.ctl label{font-size:9px;font-weight:700;letter-spacing:.12em;color:#666;text-transform:uppercase}
input[type=file]{font-size:11px;color:#999;max-width:190px}
select{background:#1e1e1e;border:1px solid #2e2e2e;color:#fff;border-radius:6px;padding:6px 9px;font-size:11px;outline:none}
.sens-row{display:flex;align-items:center;gap:5px}
.sens-row input{accent-color:var(--orange);width:80px}
.sens-row .v{font-size:11px;font-weight:700;min-width:14px}

/* ── stage ── */
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
  background:#000;min-height:0;overflow:hidden}
#cv{max-width:100%;max-height:100%;display:block;cursor:pointer}
video{display:none}

/* ── status overlay ── */
.status{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;background:rgba(0,0,0,.82);z-index:5;text-align:center;padding:24px}
.status.hidden{display:none}
.spinner{width:40px;height:40px;border:3px solid #252525;border-top-color:var(--orange);
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status .msg{font-size:13px;color:#aaa;max-width:400px;line-height:1.5}
.status .hint{font-size:11px;color:#555;max-width:400px;line-height:1.5}

/* ── pause indicator ── */
#pauseIcon{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  font-size:80px;color:rgba(255,255,255,.55);pointer-events:none}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="ey">Guitar Analytics · Live</div>
    <div class="ti">Strum Hand Tracker</div>
  </div>
  <div class="ctl">
    <input type="file" id="vfile" accept="video/*">
  </div>
  <div class="ctl">
    <label>Source</label>
    <select id="onsetMode">
      <option value="audio">Audio onsets</option>
      <option value="motion">Motion only</option>
    </select>
  </div>
  <div class="ctl">
    <div class="sens-row">
      <label>Sens</label>
      <input type="range" id="sens" min="1" max="10" value="5"
        oninput="document.getElementById('sensv').textContent=this.value">
      <span class="v" id="sensv">5</span>
    </div>
  </div>
  <button class="btn ghost" id="webcamBtn">Webcam</button>
  <button class="btn" id="playBtn" disabled>Play</button>
  <button class="btn ghost" id="resetBtn">Reset</button>
</div>

<div class="stage">
  <canvas id="cv"></canvas>
  <div class="status" id="status">
    <div class="spinner" id="spin"></div>
    <div class="msg" id="statusMsg">Loading MediaPipe model…</div>
    <div class="hint" id="statusHint">Downloads ~10 MB from CDN on first run. Needs internet.</div>
  </div>
  <div id="pauseIcon">⏸</div>
</div>

<video id="vid" playsinline crossorigin="anonymous"></video>

<script type="module">
import {
  HandLandmarker, FilesetResolver, DrawingUtils
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/vision_bundle.mjs";

// ── refs ───────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const vid = $('vid');
const cv  = $('cv');
const ctx = cv.getContext('2d');

// ── state ──────────────────────────────────────────────────────────────
let handLandmarker = null, drawer = null;
let running = false, lastVideoTime = -1, isPaused = false;

// motion
let prevCenter = null, velEMA = 0;
const VEL_ALPHA = 0.55;

// audio
let audioCtx = null, analyser = null, srcNode = null;
let freqPrev = null;

// flux history: [{v, onset}] — kept at max FLUX_MAX entries
const FLUX_MAX = 120;
let fluxHist = [];   // {v:number, onset:bool}

// onsets
let lastOnsetAt  = -1;
let velPrev = 0, velRising = false;

// pattern
let strokes = [];    // {t, dir}
let downCount = 0, upCount = 0;

// arrow FX
let arrowFx = null;  // {x,y,dir,born}

// ── model init ─────────────────────────────────────────────────────────
async function initModel(){
  try{
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/wasm"
    );
    handLandmarker = await HandLandmarker.createFromOptions(vision,{
      baseOptions:{
        modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate:"GPU"
      },
      runningMode:"VIDEO", numHands:1,
      minHandDetectionConfidence:0.4, minTrackingConfidence:0.4
    });
    drawer = new DrawingUtils(ctx);
    hideStatus();
    $('playBtn').disabled = !vid.src;
  }catch(err){
    showStatus("Model failed to load.", `${err.message} — check internet and reload.`);
  }
}

function showStatus(msg, hint){
  $('spin').style.display = 'none';
  $('statusMsg').textContent = msg;
  $('statusHint').textContent = hint || '';
  $('status').classList.remove('hidden');
}
function hideStatus(){ $('status').classList.add('hidden'); }

// ── file / webcam ──────────────────────────────────────────────────────
$('vfile').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  stop();
  vid.srcObject = null;
  vid.src = URL.createObjectURL(f);
  vid.muted = false; vid.loop = true;
  resetState();
  vid.onloadeddata = ()=>{ sizeCanvas(); $('playBtn').disabled=!handLandmarker; drawStill(); };
});

$('webcamBtn').addEventListener('click', async ()=>{
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:true,audio:false});
    stop();
    vid.src=''; vid.srcObject=stream; vid.muted=true;
    $('onsetMode').value='motion';
    resetState();
    vid.onloadeddata=()=>{ sizeCanvas(); vid.play(); start(); };
  }catch(err){ alert('Webcam error: '+err.message); }
});

$('playBtn').addEventListener('click', togglePlay);
cv.addEventListener('click', togglePlay);

function togglePlay(){
  if(!vid.src && !vid.srcObject) return;
  if(running){
    vid.pause(); stop(); setPauseUI(true);
  } else {
    setupAudio(); vid.play(); start(); setPauseUI(false);
  }
}

function setPauseUI(paused){
  isPaused = paused;
  $('playBtn').textContent = paused ? 'Play' : 'Pause';
  $('pauseIcon').style.display = paused ? 'flex' : 'none';
}

$('resetBtn').addEventListener('click', ()=>{ resetState(); if(!isPaused) drawStill(); });

function sizeCanvas(){
  cv.width  = vid.videoWidth  || 640;
  cv.height = vid.videoHeight || 480;
}
function drawStill(){
  if(vid.readyState >= 2) ctx.drawImage(vid, 0, 0, cv.width, cv.height);
}
function resetState(){
  strokes=[]; downCount=0; upCount=0;
  prevCenter=null; velEMA=0; freqPrev=null; fluxHist=[];
  lastOnsetAt=-1; velPrev=0; velRising=false; arrowFx=null;
}

// ── audio ──────────────────────────────────────────────────────────────
function setupAudio(){
  if($('onsetMode').value !== 'audio' || vid.srcObject || audioCtx) return;
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    srcNode  = audioCtx.createMediaElementSource(vid);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0;
    srcNode.connect(analyser);
    analyser.connect(audioCtx.destination);
    freqPrev = new Float32Array(analyser.frequencyBinCount);
  }catch(err){
    console.warn('Audio setup failed:', err);
    $('onsetMode').value = 'motion';
  }
}

// ── main loop ──────────────────────────────────────────────────────────
function start(){ running=true; setPauseUI(false); requestAnimationFrame(loop); }
function stop() { running=false; }

function loop(){
  if(!running) return;
  if(vid.readyState >= 2 && vid.currentTime !== lastVideoTime){
    lastVideoTime = vid.currentTime;
    processFrame(performance.now());
  }
  requestAnimationFrame(loop);
}

// ── core frame processing ──────────────────────────────────────────────
function processFrame(tMs){
  ctx.drawImage(vid, 0, 0, cv.width, cv.height);

  // 1. hand landmarks
  let center = null;
  const res = handLandmarker.detectForVideo(vid, tMs);
  if(res.landmarks?.length){
    const lm = res.landmarks[0];
    drawer.drawConnectors(lm, HandLandmarker.HAND_CONNECTIONS,
      {color:'#00E08A66', lineWidth:6});
    drawer.drawConnectors(lm, HandLandmarker.HAND_CONNECTIONS,
      {color:'#00E08A', lineWidth:3});
    drawer.drawLandmarks(lm,
      {color:'#FF334499', fillColor:'#FF3344', radius:8, lineWidth:2});
    const palm = [0,5,9,13,17];
    let sx=0, sy=0;
    palm.forEach(i=>{ sx+=lm[i].x; sy+=lm[i].y; });
    center = {x:sx/palm.length, y:sy/palm.length};
  }

  // 2. velocity EMA
  if(center && prevCenter){
    const dy = center.y - prevCenter.y;
    const dx = center.x - prevCenter.x;
    // use whichever axis moves more
    const motion = Math.abs(dy) >= Math.abs(dx) ? dy : dx;
    velEMA = VEL_ALPHA * motion + (1-VEL_ALPHA) * velEMA;
  }
  prevCenter = center;

  // 3. onset detection
  const t = vid.currentTime;
  const mode = $('onsetMode').value;
  let onset = false;
  if(mode === 'audio' && analyser) onset = detectAudioOnset(t);
  else onset = detectMotionOnset(t);

  if(onset && center){
    const dir = velEMA >= 0 ? 'down' : 'up';
    registerStroke(t, dir);
    arrowFx = {x:center.x*cv.width, y:center.y*cv.height, dir, born:performance.now()};
  }

  // 4. draw all overlays
  drawArrowFx();
  drawTopChips(center);
  drawBottomOverlay();
}

// ── onset: spectral flux ───────────────────────────────────────────────
function detectAudioOnset(t){
  const freq = new Float32Array(analyser.frequencyBinCount);
  analyser.getFloatFrequencyData(freq);
  let flux = 0;
  for(let i=0;i<freq.length;i++){
    const a = isFinite(freq[i]) ? freq[i] : -140;
    const b = isFinite(freqPrev[i]) ? freqPrev[i] : -140;
    const d = a-b; if(d>0) flux+=d;
    freqPrev[i]=a;
  }
  const sens = +$('sens').value;
  const k = 2.6 - (sens-1)*(2.6-0.6)/9;
  const vals = fluxHist.map(e=>e.v);
  const mean = vals.length ? vals.reduce((s,v)=>s+v,0)/vals.length : 0;
  const std  = vals.length > 2
    ? Math.sqrt(vals.reduce((s,v)=>s+(v-mean)**2,0)/vals.length) : 1;
  const isOnset = flux > mean + k*std && flux > 3 && (t-lastOnsetAt) > 0.1;
  if(isOnset) lastOnsetAt = t;
  fluxHist.push({v:flux, onset:isOnset});
  if(fluxHist.length > FLUX_MAX) fluxHist.shift();
  return isOnset;
}

// ── onset: motion peaks ────────────────────────────────────────────────
function detectMotionOnset(t){
  // push a zero-flux entry so the chart still scrolls
  fluxHist.push({v:Math.abs(velEMA)*200, onset:false});
  if(fluxHist.length > FLUX_MAX) fluxHist.shift();
  const sens = +$('sens').value;
  const minMag = 0.013 - (sens-1)*(0.013-0.002)/9;
  const speed = Math.abs(velEMA);
  let onset = false;
  if(velRising && speed < velPrev && velPrev > minMag && (t-lastOnsetAt) > 0.11){
    lastOnsetAt=t; onset=true;
    fluxHist[fluxHist.length-1].onset=true;
  }
  velRising = speed > velPrev;
  velPrev = speed;
  return onset;
}

function registerStroke(t, dir){
  strokes.push({t, dir});
  if(dir==='down') downCount++; else upCount++;
}

// ── overlays ───────────────────────────────────────────────────────────
function drawArrowFx(){
  if(!arrowFx) return;
  const age = (performance.now()-arrowFx.born)/500;
  if(age >= 1){ arrowFx=null; return; }
  const alpha = 1-age;
  const col = arrowFx.dir==='down' ? '232,71,42' : '34,119,221';
  const size = 80 + age*30;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = `rgb(${col})`;
  ctx.fillStyle   = `rgb(${col})`;
  ctx.lineWidth = 10;
  const {x,y} = arrowFx;
  const d = arrowFx.dir==='down' ? 1 : -1;
  ctx.beginPath();
  ctx.moveTo(x, y - d*size/2);
  ctx.lineTo(x, y + d*size/2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x,           y + d*size/2);
  ctx.lineTo(x - size/3,  y + d*size/2 - d*size/3);
  ctx.lineTo(x + size/3,  y + d*size/2 - d*size/3);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawTopChips(center){
  const W = cv.width;
  const speed = (Math.abs(velEMA)*1000).toFixed(0);
  const dir = !center ? '—' : velEMA >= 0 ? 'DOWN ↓' : 'UP ↑';
  const dirCol = !center ? '#888' : velEMA >= 0 ? '#E8472A' : '#2277DD';
  const chips = [
    ['DIRECTION', dir, dirCol],
    ['SPEED', center ? speed : '—', '#fff'],
    ['STROKES', String(strokes.length), '#fff'],
    ['DOWN/UP', `${downCount}/${upCount}`, '#fff'],
  ];
  ctx.save();
  let x = 12;
  chips.forEach(([lbl,val,col])=>{
    const w = 106;
    ctx.fillStyle = 'rgba(0,0,0,.62)';
    roundRect(x, 10, w, 44, 6);
    ctx.fill();
    ctx.fillStyle = '#E8472A';
    ctx.font = '800 8px -apple-system,sans-serif';
    ctx.fillText(lbl, x+8, 24);
    ctx.fillStyle = col;
    ctx.font = '800 17px -apple-system,sans-serif';
    ctx.fillText(val, x+8, 42);
    x += w + 6;
  });
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

// ── bottom overlay: flux chart + pattern ──────────────────────────────
function drawBottomOverlay(){
  const W = cv.width, H = cv.height;
  const OH = Math.floor(H * 0.25);   // overlay height = 25% of video
  const OY = H - OH;

  // dark background
  ctx.fillStyle = 'rgba(0,0,0,.65)';
  ctx.fillRect(0, OY, W, OH);

  const CHART_H = Math.floor(OH * 0.50);
  const PAT_H   = OH - CHART_H;

  // separator
  ctx.strokeStyle = '#1e1e1e';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, OY+CHART_H); ctx.lineTo(W, OY+CHART_H); ctx.stroke();

  drawFluxChart(0, OY+2, W, CHART_H-4);
  drawPatternOnCanvas(0, OY+CHART_H, W, PAT_H);
}

function drawFluxChart(x,y,w,h){
  const n = fluxHist.length;
  if(n < 2) return;

  // compute adaptive threshold for drawing
  const vals = fluxHist.map(e=>e.v);
  const mean = vals.reduce((s,v)=>s+v,0)/vals.length;
  const std  = vals.length > 2
    ? Math.sqrt(vals.reduce((s,v)=>s+(v-mean)**2,0)/vals.length) : 1;
  const sens = +$('sens').value;
  const k = 2.6 - (sens-1)*(2.6-0.6)/9;
  const thresh = mean + k*std;
  const maxV = Math.max(...vals, thresh*1.1, 1);

  ctx.save();
  const BAR_W = w / FLUX_MAX;

  // fill gaps on left when history < FLUX_MAX
  const offset = FLUX_MAX - n;

  fluxHist.forEach((entry, i)=>{
    const bh = (entry.v / maxV) * h;
    const bx = x + (offset + i) * BAR_W;
    const by = y + h - bh;
    if(entry.onset){
      ctx.fillStyle = '#E8472A';
    } else {
      const intensity = Math.min(1, entry.v/Math.max(thresh,1));
      ctx.fillStyle = `rgba(34,119,221,${0.15 + intensity*0.5})`;
    }
    ctx.fillRect(bx, by, Math.max(BAR_W-1,1), bh);
  });

  // threshold line
  const ty = y + h - (thresh/maxV)*h;
  ctx.strokeStyle = 'rgba(232,71,42,0.5)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(x,ty); ctx.lineTo(x+w,ty); ctx.stroke();
  ctx.setLineDash([]);

  // label
  ctx.fillStyle = '#666';
  ctx.font = '700 9px -apple-system,sans-serif';
  ctx.fillText('AUDIO FLUX', x+6, y+12);
  ctx.fillStyle = 'rgba(232,71,42,0.7)';
  ctx.fillText('— threshold', x+6, ty-3);

  ctx.restore();
}

function drawPatternOnCanvas(x,y,w,h){
  if(!strokes.length) return;

  // show last N strokes that fit
  const S = Math.min(32, strokes.length);
  const recent = strokes.slice(-S);

  // font size to fit S symbols + group spaces in width w
  const groups = Math.ceil(S/4);
  const totalSlots = S + groups - 1;  // symbols + group gaps
  const rawFontSize = (w * 0.85) / (totalSlots * 0.7);
  const fontSize = Math.max(18, Math.min(48, rawFontSize));

  ctx.save();
  ctx.font = `900 ${fontSize}px -apple-system,monospace`;
  ctx.textBaseline = 'middle';

  // measure total width to center
  const cy = y + h/2 + 2;
  let totalW = 0;
  recent.forEach((s,i)=>{
    totalW += ctx.measureText(s.dir==='down'?'↓':'↑').width;
    if(i>0 && i%4===0) totalW += fontSize*0.4;
    if(i<S-1) totalW += fontSize*0.08;
  });
  let cx = x + (w - totalW)/2;

  recent.forEach((s,i)=>{
    if(i>0 && i%4===0) cx += fontSize*0.4;
    const sym = s.dir==='down' ? '↓' : '↑';
    // glow
    ctx.shadowColor = s.dir==='down' ? '#E8472A' : '#2277DD';
    ctx.shadowBlur  = 12;
    ctx.fillStyle   = s.dir==='down' ? '#E8472A' : '#4499FF';
    ctx.fillText(sym, cx, cy);
    cx += ctx.measureText(sym).width + fontSize*0.08;
  });
  ctx.restore();

  // BPM + count
  const downs = strokes.filter(s=>s.dir==='down').map(s=>s.t);
  let bpmTxt = '– BPM';
  if(downs.length >= 3){
    const gaps = [];
    for(let i=1;i<downs.length;i++){const g=downs[i]-downs[i-1];if(g>.15&&g<2)gaps.push(g);}
    if(gaps.length){
      gaps.sort((a,b)=>a-b);
      bpmTxt = Math.round(60/gaps[Math.floor(gaps.length/2)]) + ' BPM';
    }
  }
  ctx.save();
  ctx.font = '700 11px -apple-system,sans-serif';
  ctx.fillStyle = '#888';
  ctx.textBaseline = 'bottom';
  ctx.fillText(`↓${downCount} ↑${upCount}  ·  ${bpmTxt}`, x+8, y+h-4);
  ctx.restore();
}

// ── init ───────────────────────────────────────────────────────────────
initModel();
</script>
</body>
</html>
