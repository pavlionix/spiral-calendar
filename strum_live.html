<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strum Live</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#00FF88;--purple:#CC44FF;--bg:#0c0c0c}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:#fff;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

.topbar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#0a0a0a;
  border-bottom:1px solid #1c1c1c;flex-shrink:0;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:auto}
.brand .ey{font-size:9px;font-weight:800;letter-spacing:.18em;color:var(--green);text-transform:uppercase}
.brand .ti{font-size:14px;font-weight:800}
.btn{padding:8px 15px;background:#E8472A;border:none;border-radius:6px;color:#fff;
  font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;border:1px solid #2e2e2e;color:#aaa}
.btn:disabled{opacity:.35;cursor:not-allowed}
.ctl{display:flex;align-items:center;gap:6px}
.ctl label{font-size:9px;font-weight:700;letter-spacing:.12em;color:#666;text-transform:uppercase}
input[type=file]{font-size:11px;color:#999;max-width:190px}
select{background:#1e1e1e;border:1px solid #2e2e2e;color:#fff;border-radius:6px;
  padding:6px 9px;font-size:11px;outline:none}
.sens-row{display:flex;align-items:center;gap:5px}
.sens-row input{accent-color:var(--green);width:80px}
.sens-row .v{font-size:11px;font-weight:700;min-width:14px}

/* stage fills all remaining vertical space */
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
  background:#000;min-height:0;overflow:hidden}
/* canvas fills the stage — browser scales it down to fit */
#cv{max-width:100%;max-height:100%;display:block;cursor:pointer;image-rendering:auto}
video{display:none}

.status{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;background:rgba(0,0,0,.82);z-index:5;
  text-align:center;padding:24px}
.status.hidden{display:none}
.spinner{width:40px;height:40px;border:3px solid #252525;border-top-color:var(--green);
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status .msg{font-size:13px;color:#aaa;max-width:400px;line-height:1.5}
.status .hint{font-size:11px;color:#555;max-width:400px;line-height:1.5}

#pauseIcon{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  font-size:80px;color:rgba(255,255,255,.55);pointer-events:none}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="ey">Guitar Analytics · Live</div>
    <div class="ti">Strum Hand Tracker</div>
  </div>
  <div class="ctl">
    <input type="file" id="vfile" accept="video/*">
  </div>
  <div class="ctl">
    <label>Source</label>
    <select id="onsetMode">
      <option value="audio">Audio onsets</option>
      <option value="motion">Motion only</option>
    </select>
  </div>
  <div class="ctl">
    <div class="sens-row">
      <label>Sens</label>
      <input type="range" id="sens" min="1" max="10" value="5"
        oninput="document.getElementById('sensv').textContent=this.value">
      <span class="v" id="sensv">5</span>
    </div>
  </div>
  <button class="btn ghost" id="webcamBtn">Webcam</button>
  <button class="btn" id="playBtn" disabled>Play</button>
  <button class="btn ghost" id="resetBtn">Reset</button>
</div>

<div class="stage">
  <canvas id="cv"></canvas>
  <div class="status" id="status">
    <div class="spinner" id="spin"></div>
    <div class="msg" id="statusMsg">Loading MediaPipe model…</div>
    <div class="hint" id="statusHint">Downloads ~10 MB from CDN on first run. Needs internet.</div>
  </div>
  <div id="pauseIcon">⏸</div>
</div>

<video id="vid" playsinline preload="auto" crossorigin="anonymous"></video>

<script type="module">
import {
  HandLandmarker, FilesetResolver, DrawingUtils
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/vision_bundle.mjs";
import {
  palmCenter, classifyDir, spectralFlux, audioOnsetDecision,
  sensToK, sensToMinMag, vibScale, vibGlow,
  estimateBPM, meanStd, HandTracker,
  calcCanvasSize, uiScale,
} from "./strum_core.js";

const $ = id => document.getElementById(id);
const vid = $('vid');
const cv  = $('cv');
const ctx = cv.getContext('2d');

const CLR_DOWN = '#00FF88';
const CLR_UP   = '#CC44FF';
const RGB_DOWN = '0,255,136';
const RGB_UP   = '204,68,255';
const CLR_DIM  = '#888';

// ── state ───────────────────────────────────────────────────────────────
let handLandmarker = null, drawer = null;
let running = false, lastVideoTime = -1, isPaused = false;

const tracker = new HandTracker();
let velEMA = 0, handSpeed = 0, haveHand = false;

let audioCtx = null, analyser = null, srcNode = null;
let freqPrev = null;

const FLUX_MAX = 120;
let fluxHist = [];

let lastOnsetAt      = -1;
let lastOnsetPfNow   = -Infinity;
let lastStrokePfNow  = -Infinity;
let prevSpeed = 0, speedRising = false;

let strokes = [];
let downCount = 0, upCount = 0;

let arrowFx = null;

// MediaPipe frame-skip: run detection every other frame,
// redraw the previous landmarks on the frames in between.
// Halves GPU/CPU cost with no visible quality loss at 30 fps.
let mpFrame = 0, lastMpResult = null, lastTrackerResult = {chosen:null};

const REFRACTORY = 0.12;

// ── model ───────────────────────────────────────────────────────────────
async function initModel(){
  try{
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/wasm"
    );
    handLandmarker = await HandLandmarker.createFromOptions(vision,{
      baseOptions:{
        modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate:"GPU"
      },
      runningMode:"VIDEO", numHands:2,
      minHandDetectionConfidence:0.4, minTrackingConfidence:0.4
    });
    drawer = new DrawingUtils(ctx);
    hideStatus();
    $('playBtn').disabled = !vid.src;
  }catch(err){
    showStatus("Model failed to load.", `${err.message} — check internet and reload.`);
  }
}

function showStatus(msg, hint){
  $('spin').style.display = 'none';
  $('statusMsg').textContent = msg;
  $('statusHint').textContent = hint || '';
  $('status').classList.remove('hidden');
}
function hideStatus(){ $('status').classList.add('hidden'); }

// ── file / webcam ────────────────────────────────────────────────────────
$('vfile').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  stop(); vid.srcObject = null;
  vid.src = URL.createObjectURL(f);
  vid.muted = false; vid.loop = true;
  resetState();
  vid.onloadeddata = ()=>{ sizeCanvas(); $('playBtn').disabled=!handLandmarker; drawStill(); };
});

$('webcamBtn').addEventListener('click', async ()=>{
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:false});
    stop(); vid.src=''; vid.srcObject=stream; vid.muted=true;
    $('onsetMode').value='motion';
    resetState();
    vid.onloadeddata=()=>{ sizeCanvas(); vid.play(); start(); };
  }catch(err){ alert('Webcam error: '+err.message); }
});

$('playBtn').addEventListener('click', togglePlay);
cv.addEventListener('click', ()=>{
  // only toggle if the video is actually ready (canvas sized)
  if(vid.videoWidth > 0) togglePlay();
});

function togglePlay(){
  if(!vid.src && !vid.srcObject) return;
  if(running){ vid.pause(); stop(); setPauseUI(true); }
  else { setupAudio(); vid.play(); start(); setPauseUI(false); }
}

function setPauseUI(paused){
  isPaused = paused;
  $('playBtn').textContent = paused ? 'Play' : 'Pause';
  $('pauseIcon').style.display = paused ? 'flex' : 'none';
}

$('resetBtn').addEventListener('click', ()=>{ resetState(); if(!isPaused) drawStill(); });

function sizeCanvas(){
  // Cap the longer dimension at 1280 px so MediaPipe stays fast on
  // large files (4K, long portrait videos). The canvas is CSS-scaled
  // to fill the stage, so the user sees the full-quality image.
  const { w, h } = calcCanvasSize(vid.videoWidth||640, vid.videoHeight||480);
  cv.width = w; cv.height = h;
}

function drawStill(){
  if(vid.readyState >= 2) ctx.drawImage(vid, 0, 0, cv.width, cv.height);
}

function resetState(){
  strokes=[]; downCount=0; upCount=0;
  velEMA=0; handSpeed=0; haveHand=false;
  freqPrev=null; fluxHist=[];
  lastOnsetAt=-1; prevSpeed=0; speedRising=false; arrowFx=null;
  lastOnsetPfNow=-Infinity; lastStrokePfNow=-Infinity;
  mpFrame=0; lastMpResult=null; lastTrackerResult={chosen:null};
}

// ── audio ────────────────────────────────────────────────────────────────
function setupAudio(){
  if($('onsetMode').value !== 'audio' || vid.srcObject || audioCtx) return;
  try{
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    srcNode  = audioCtx.createMediaElementSource(vid);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0;
    srcNode.connect(analyser);
    analyser.connect(audioCtx.destination);
    freqPrev = new Float32Array(analyser.frequencyBinCount);
  }catch(err){
    console.warn('Audio setup failed:', err);
    $('onsetMode').value = 'motion';
  }
}

// ── loop — prefer requestVideoFrameCallback (fires once per decoded frame)
// over rAF (fires at monitor Hz, causing duplicate processing and
// wasted MediaPipe calls on 30 fps video on a 60 Hz display).
function start(){ running=true; setPauseUI(false); scheduleFrame(); }
function stop() { running=false; }

function scheduleFrame(){
  if(!running) return;
  if(vid.requestVideoFrameCallback){
    vid.requestVideoFrameCallback(rvfcTick);
  } else {
    requestAnimationFrame(rafTick);
  }
}

function rvfcTick(now){
  if(!running) return;
  processFrame(now);
  vid.requestVideoFrameCallback(rvfcTick);
}

function rafTick(){
  if(!running) return;
  if(vid.readyState >= 2 && vid.currentTime !== lastVideoTime){
    lastVideoTime = vid.currentTime;
    processFrame(performance.now());
  }
  requestAnimationFrame(rafTick);
}

// ── core frame processing ────────────────────────────────────────────────
function processFrame(tMs){
  // Always draw the raw frame first — audio plays before hand detection
  ctx.drawImage(vid, 0, 0, cv.width, cv.height);

  // MediaPipe runs every other frame; reuse previous landmarks in between.
  // The tracker is only updated on real detections to avoid false-zero
  // motion reports on skip frames.
  const doMP = (mpFrame++ % 2 === 0) || !lastMpResult;
  let hands, chosen;
  if(doMP){
    lastMpResult = handLandmarker.detectForVideo(vid, tMs);
    const centers = (lastMpResult.landmarks ?? []).map(palmCenter);
    lastTrackerResult = tracker.update(centers);
  }
  hands  = lastMpResult?.landmarks ?? [];
  chosen = lastTrackerResult.chosen;

  // draw all visible hands
  hands.forEach((lm, i) => drawHand(lm, chosen && i === chosen.index));

  // velocity and position from the chosen strumming hand
  let center = null;
  if(chosen){
    haveHand  = true;
    velEMA    = chosen.velEMA;
    handSpeed = chosen.speed;
    const lm = hands[chosen.index];
    if(lm){
      const c = palmCenter(lm);
      center = { x: c.x * cv.width, y: c.y * cv.height };
    }
  } else {
    haveHand = false;
  }

  // onset detection (audio runs every frame for accuracy; motion needs MP)
  const t    = vid.currentTime;
  const mode = $('onsetMode').value;
  let onset  = false;
  if(mode === 'audio' && analyser) onset = detectAudioOnset(t);
  else if(doMP) onset = detectMotionOnset(t);  // only on MP frames

  if(onset && center){
    const dir = classifyDir(velEMA);
    registerStroke(t, dir);
    arrowFx = { x: center.x, y: center.y, dir, born: performance.now() };
  }

  // overlays
  drawArrowFx();
  drawTopChips();
  drawFluxStrip();
  drawPatternOverlay();
}

// ── draw a single hand skeleton ──────────────────────────────────────────
function drawHand(lm, isChosen){
  if(isChosen){
    const rgb = velEMA >= 0 ? RGB_DOWN : RGB_UP;
    const col = velEMA >= 0 ? CLR_DOWN : CLR_UP;
    drawer.drawConnectors(lm, HandLandmarker.HAND_CONNECTIONS,
      {color:`rgba(${rgb},0.28)`, lineWidth:10});
    drawer.drawConnectors(lm, HandLandmarker.HAND_CONNECTIONS,
      {color:col, lineWidth:4});
    drawer.drawLandmarks(lm,
      {color:`rgba(${rgb},0.55)`, fillColor:col, radius:9, lineWidth:2});
  } else {
    drawer.drawConnectors(lm, HandLandmarker.HAND_CONNECTIONS,
      {color:'rgba(120,120,120,0.4)', lineWidth:2});
    drawer.drawLandmarks(lm,
      {color:'rgba(120,120,120,0.45)', fillColor:CLR_DIM, radius:3, lineWidth:1});
  }
}

// ── audio onset ──────────────────────────────────────────────────────────
function detectAudioOnset(t){
  const freq = new Float32Array(analyser.frequencyBinCount);
  analyser.getFloatFrequencyData(freq);
  const { flux, nextPrev } = spectralFlux(freq, freqPrev);
  freqPrev = nextPrev;

  const k = sensToK(+$('sens').value);
  const isOnset = audioOnsetDecision({
    flux, histVals: fluxHist.map(e=>e.v), k, minFlux: 3,
    dtSinceLast: t - lastOnsetAt, refractory: REFRACTORY,
  });
  if(isOnset){ lastOnsetAt = t; lastOnsetPfNow = performance.now(); }
  fluxHist.push({v: flux, onset: isOnset});
  if(fluxHist.length > FLUX_MAX) fluxHist.shift();
  return isOnset;
}

// ── motion onset ─────────────────────────────────────────────────────────
function detectMotionOnset(t){
  fluxHist.push({v: handSpeed * 200, onset: false});
  if(fluxHist.length > FLUX_MAX) fluxHist.shift();
  const minMag = sensToMinMag(+$('sens').value);
  let onset = false;
  if(speedRising && handSpeed < prevSpeed && prevSpeed > minMag
     && (t - lastOnsetAt) > REFRACTORY){
    lastOnsetAt = t; onset = true; lastOnsetPfNow = performance.now();
    fluxHist[fluxHist.length-1].onset = true;
  }
  speedRising = handSpeed > prevSpeed;
  prevSpeed   = handSpeed;
  return onset;
}

function registerStroke(t, dir){
  strokes.push({t, dir});
  if(dir==='down') downCount++; else upCount++;
  lastStrokePfNow = performance.now();
}

// ── arrow FX (damped vibration on the strumming hand) ────────────────────
function drawArrowFx(){
  if(!arrowFx) return;
  const ageSec = (performance.now() - arrowFx.born) / 1000;
  if(ageSec >= 0.75){ arrowFx = null; return; }

  const { arrowSize } = uiScale(cv.width, cv.height);
  const env   = Math.exp(-ageSec * 7);
  const osc   = (1 + Math.cos(ageSec * 22)) / 2;
  const vib   = 1 + env * 0.7 * osc;
  const alpha = Math.pow(1 - ageSec / 0.75, 1.4);
  const isDown = arrowFx.dir === 'down';
  const rgb  = isDown ? RGB_DOWN : RGB_UP;
  const size = arrowSize * vib;
  const {x, y} = arrowFx;
  const d = isDown ? 1 : -1;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.lineCap = 'round';

  // wide glowing shaft
  ctx.shadowColor = `rgb(${rgb})`;
  ctx.shadowBlur  = 44 * env + 12;
  ctx.strokeStyle = `rgba(${rgb},0.32)`;
  ctx.lineWidth   = 26 * vib;
  ctx.beginPath(); ctx.moveTo(x, y - d*size/2); ctx.lineTo(x, y + d*size/2); ctx.stroke();

  // crisp inner shaft
  ctx.shadowBlur  = 16;
  ctx.strokeStyle = `rgb(${rgb})`;
  ctx.lineWidth   = 7;
  ctx.beginPath(); ctx.moveTo(x, y - d*size/2); ctx.lineTo(x, y + d*size/2); ctx.stroke();

  // arrowhead
  ctx.fillStyle  = `rgb(${rgb})`;
  ctx.shadowBlur = 22;
  const hw = size / 3;
  ctx.beginPath();
  ctx.moveTo(x,      y + d*size/2);
  ctx.lineTo(x - hw, y + d*size/2 - d*hw);
  ctx.lineTo(x + hw, y + d*size/2 - d*hw);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ── top metric chips — scale with canvas height ───────────────────────────
function drawTopChips(){
  const { chipH, chipW, chipGap, chipPadX,
          chipLabelSz, chipValueSz } = uiScale(cv.width, cv.height);
  const isDown = velEMA >= 0;
  const dir    = !haveHand ? '—' : isDown ? 'DOWN ↓' : 'UP ↑';
  const dirCol = !haveHand ? '#888' : isDown ? CLR_DOWN : CLR_UP;
  const chips  = [
    ['DIRECTION', dir, dirCol],
    ['SPEED',  haveHand ? (handSpeed*1000).toFixed(0) : '—', '#fff'],
    ['STROKES', String(strokes.length), '#fff'],
    ['DOWN/UP', `${downCount}/${upCount}`, '#fff'],
  ];
  ctx.save();
  const TOP = Math.round(cv.height * 0.012);
  let x = chipGap;
  chips.forEach(([lbl, val, col]) => {
    ctx.fillStyle = 'rgba(0,0,0,.8)';
    roundRect(x, TOP, chipW, chipH, 7); ctx.fill();

    ctx.fillStyle = '#666';
    ctx.font = `800 ${chipLabelSz}px -apple-system,sans-serif`;
    ctx.textBaseline = 'top';
    ctx.fillText(lbl, x + chipPadX, TOP + chipH * 0.14);

    ctx.shadowColor = col !== '#fff' ? col : 'transparent';
    ctx.shadowBlur  = col !== '#fff' ? 10 : 0;
    ctx.fillStyle   = col;
    ctx.font = `800 ${chipValueSz}px -apple-system,sans-serif`;
    ctx.textBaseline = 'bottom';
    ctx.fillText(val, x + chipPadX, TOP + chipH * 0.92);
    ctx.shadowBlur = 0;
    x += chipW + chipGap;
  });
  ctx.restore();
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y,   x+w, y+r,   r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h);  ctx.arcTo(x,   y+h, x,   y+h-r, r);
  ctx.lineTo(x, y+r);    ctx.arcTo(x,   y,   x+r,  y,   r);
  ctx.closePath();
}

// ── scrolling audio-flux strip at the bottom ─────────────────────────────
function drawFluxStrip(){
  const W = cv.width, H = cv.height;
  const { stripH } = uiScale(W, H);
  const SY = H - stripH;

  ctx.fillStyle = 'rgba(0,0,0,.88)';
  ctx.fillRect(0, SY, W, stripH);

  const n = fluxHist.length;
  if(n < 2) return;

  const vals = fluxHist.map(e => e.v);
  const { mean, std } = meanStd(vals);
  const k      = sensToK(+$('sens').value);
  const thresh = mean + k * std;
  const maxV   = Math.max(...vals, thresh * 1.1, 1);

  ctx.save();
  const BAR_W = W / FLUX_MAX;
  const pad   = 4;
  const offset = FLUX_MAX - n;

  fluxHist.forEach((entry, i) => {
    const bh = (entry.v / maxV) * (stripH - pad * 2);
    const bx = (offset + i) * BAR_W;
    const by = SY + stripH - pad - bh;
    if(entry.onset){
      ctx.fillStyle   = CLR_DOWN;
      ctx.shadowColor = CLR_DOWN;
      ctx.shadowBlur  = 14;
    } else {
      ctx.shadowBlur  = 0;
      const intensity = Math.min(1, entry.v / Math.max(thresh, 1));
      ctx.fillStyle   = `rgba(160,80,255,${0.18 + intensity * 0.55})`;
    }
    ctx.fillRect(bx, by, Math.max(BAR_W - 1, 1), bh);
  });
  ctx.shadowBlur = 0;

  // threshold line
  const ty = SY + stripH - pad - (thresh / maxV) * (stripH - pad * 2);
  ctx.strokeStyle = `rgba(${RGB_DOWN},0.4)`;
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(0, ty); ctx.lineTo(W, ty); ctx.stroke();
  ctx.setLineDash([]);

  // pulse border on recent onset
  const pulse = vibGlow((performance.now() - lastOnsetPfNow) / 1000);
  if(pulse > 0.02){
    ctx.strokeStyle = `rgba(${RGB_DOWN},${pulse * 0.75})`;
    ctx.lineWidth   = 3;
    ctx.shadowColor = CLR_DOWN;
    ctx.shadowBlur  = 16 * pulse;
    ctx.strokeRect(1, SY + 1, W - 2, stripH - 2);
    ctx.shadowBlur  = 0;
  }

  ctx.fillStyle    = 'rgba(100,100,100,0.8)';
  ctx.font         = `700 ${Math.max(10, Math.round(stripH * 0.14))}px -apple-system,sans-serif`;
  ctx.textBaseline = 'top';
  ctx.fillText('AUDIO FLUX', 8, SY + 5);
  ctx.restore();
}

// ── pattern pill — floating above the flux strip ──────────────────────────
function drawPatternOverlay(){
  if(!strokes.length) return;

  const W = cv.width, H = cv.height;
  const { stripH, patternFont } = uiScale(W, H);

  const S      = Math.min(24, strokes.length);
  const recent = strokes.slice(-S);

  // font large enough to fill the pill but respecting the computed scale
  const groups     = Math.ceil(S / 4);
  const totalSlots = S + groups - 1;
  const autoFs     = (W * 0.87) / (totalSlots * 0.72);
  const fontSize   = Math.max(patternFont, Math.min(patternFont * 1.5, autoFs));

  ctx.save();
  ctx.font         = `900 ${fontSize}px -apple-system,monospace`;
  ctx.textBaseline = 'middle';

  // measure total rendered width
  let totalW = 0;
  recent.forEach((s, i) => {
    totalW += ctx.measureText(s.dir === 'down' ? '↓' : '↑').width;
    if(i > 0 && i % 4 === 0) totalW += fontSize * 0.4;
    if(i < S - 1)             totalW += fontSize * 0.1;
  });

  const pillPadX = fontSize * 0.35;
  const pillPadY = fontSize * 0.22;
  const pillW    = totalW + pillPadX * 2;
  const pillH    = fontSize + pillPadY * 2;
  const pillX    = (W - pillW) / 2;
  const pillY    = H - stripH - pillH - Math.round(H * 0.018);

  // pill background
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  roundRect(pillX, pillY, pillW, pillH, pillH / 2);
  ctx.fill();

  // glowing pill border on recent onset
  const borderPulse = vibGlow((performance.now() - lastOnsetPfNow) / 1000);
  if(borderPulse > 0.02){
    ctx.strokeStyle = `rgba(${RGB_DOWN},${borderPulse * 0.65})`;
    ctx.lineWidth   = 3;
    ctx.shadowColor = CLR_DOWN;
    ctx.shadowBlur  = 14 * borderPulse;
    roundRect(pillX, pillY, pillW, pillH, pillH / 2);
    ctx.stroke();
    ctx.shadowBlur  = 0;
  }

  // draw symbols — last one vibrates on the beat
  const vib = vibScale((performance.now() - lastStrokePfNow) / 1000);
  const cy  = pillY + pillH / 2;
  let cx    = pillX + pillPadX;

  recent.forEach((s, i) => {
    if(i > 0 && i % 4 === 0) cx += fontSize * 0.4;

    const sym    = s.dir === 'down' ? '↓' : '↑';
    const isLast = i === recent.length - 1;
    const col    = s.dir === 'down' ? CLR_DOWN : CLR_UP;
    const rgb    = s.dir === 'down' ? RGB_DOWN : RGB_UP;
    const symW   = ctx.measureText(sym).width;

    if(isLast && vib > 1.01){
      ctx.save();
      ctx.translate(cx + symW / 2, cy);
      ctx.scale(vib, vib);
      const glow = 30 + (vib - 1) * 90;
      ctx.shadowColor = col; ctx.fillStyle = col;
      ctx.shadowBlur  = glow * 2;
      ctx.fillText(sym, -symW / 2, 0);
      ctx.shadowBlur  = glow * 0.5;
      ctx.fillText(sym, -symW / 2, 0);
      ctx.restore();
    } else {
      ctx.shadowColor = col;
      ctx.shadowBlur  = isLast ? 24 : 10;
      ctx.fillStyle   = col;

      // completed strokes: show direction-tinted glow; last one is brightest
      if(!isLast) ctx.globalAlpha = 0.75 + 0.25 * (i / (S - 1));
      ctx.fillText(sym, cx, cy);
      ctx.globalAlpha = 1;
    }
    ctx.shadowBlur = 0;
    cx += symW + fontSize * 0.1;
  });
  ctx.restore();

  // BPM label to the right of the pill
  const downs = strokes.filter(s => s.dir === 'down').map(s => s.t);
  const bpm   = estimateBPM(downs);
  if(bpm){
    ctx.save();
    ctx.font         = `700 ${Math.max(12, Math.round(fontSize * 0.3))}px -apple-system,sans-serif`;
    ctx.textBaseline = 'middle';
    ctx.fillStyle    = 'rgba(140,140,140,0.9)';
    ctx.fillText(`${bpm} BPM`, pillX + pillW + Math.round(W * 0.01), pillY + pillH / 2);
    ctx.restore();
  }
}

initModel();
</script>
</body>
</html>
